<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <filter id="gh-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#8b5cf6" flood-opacity="0.35"/>
    </filter>
    <filter id="octocat-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Deep Metallic Violet/Dark Gradient Background -->
    <linearGradient id="gh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Octocat 3D Fill Gradient -->
    <linearGradient id="cat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Violet/Cyan Edge Rim Light -->
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle Glass Card -->
  <rect x="8" y="8" width="80" height="80" rx="22" fill="url(#gh-bg)" filter="url(#gh-glow)"/>
  <rect x="8.5" y="8.5" width="79" height="79" rx="21.5" fill="none" stroke="url(#rim-grad)" stroke-width="1.2" opacity="0.6"/>

  <!-- Subtle Inner Radial Ring -->
  <circle cx="48" cy="48" r="32" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Official GitHub Silhouette with Depth -->
  <g filter="url(#octocat-shadow)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M48 18C31.43 18 18 31.43 18 48C18 61.26 26.6 72.49 38.53 76.45C40.03 76.73 40.58 75.8 40.58 75C40.58 74.29 40.55 71.9 40.55 69.31C32.19 71.12 30.43 65.73 30.43 65.73C29.06 62.26 27.09 61.34 27.09 61.34C24.36 59.47 27.3 59.51 27.3 59.51C30.32 59.72 31.91 62.61 31.91 62.61C34.59 67.2 38.94 65.87 40.66 65.1C40.93 63.16 41.71 61.83 42.57 61.08C35.9 60.32 28.89 57.75 28.89 46.22C28.89 42.94 30.06 40.26 31.99 38.16C31.68 37.4 30.65 34.34 32.28 30.22C32.28 30.22 34.8 29.41 40.55 33.31C42.95 32.64 45.48 32.31 48 32.3C50.52 32.31 53.05 32.64 55.45 33.31C61.2 29.41 63.72 30.22 63.72 30.22C65.35 34.34 64.32 37.4 64.01 38.16C65.94 40.26 67.11 42.94 67.11 46.22C67.11 57.78 60.09 60.31 53.4 61.05C54.48 61.98 55.45 63.81 55.45 66.61C55.45 70.62 55.41 73.86 55.41 74.84C55.41 75.65 55.95 76.6 57.48 76.3C69.41 72.33 78 61.18 78 48C78 31.43 64.57 18 48 18Z" fill="url(#cat-grad)"/>
  </g>

  <!-- Glass Specular Curved Reflection -->
  <path d="M12 18 C20 10, 40 8, 56 12 C34 16, 20 30, 16 48 Z" fill="#ffffff" opacity="0.12"/>
</svg>
