<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <filter id="about-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0078d4" flood-opacity="0.35"/>
    </filter>
    <filter id="avatar-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#001830" flood-opacity="0.3"/>
    </filter>

    <!-- Main Squircle Background Gradient -->
    <linearGradient id="about-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="50%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#0047a0"/>
    </linearGradient>

    <!-- Avatar Face Gradient -->
    <linearGradient id="face-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <!-- Avatar Torso Gradient -->
    <linearGradient id="torso-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Golden Badge / Star Accent Gradient -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#ff7700"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle Glass Card -->
  <rect x="8" y="8" width="80" height="80" rx="22" fill="url(#about-bg-grad)" filter="url(#about-glow)"/>
  <rect x="8.5" y="8.5" width="79" height="79" rx="21.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Subtle Inner Ring -->
  <circle cx="48" cy="48" r="32" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12"/>

  <!-- Avatar Head -->
  <circle cx="48" cy="36" r="14" fill="url(#face-grad)" filter="url(#avatar-shadow)"/>

  <!-- Avatar Shoulders / Torso -->
  <path d="M26 72 C26 56, 36 52, 48 52 C60 52, 70 56, 70 72 Z" fill="url(#torso-grad)" filter="url(#avatar-shadow)"/>

  <!-- Modern Dev Code Tag Badge / Star at Bottom-Right -->
  <circle cx="68" cy="68" r="12" fill="url(#badge-grad)" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.3))"/>
  <!-- Code brackets </> inside badge -->
  <path d="M64 65 L61 68 L64 71" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M72 65 L75 68 L72 71" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="69.5" y1="64" x2="66.5" y2="72" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Glass Highlight Arc -->
  <path d="M12 18 C20 10, 40 8, 56 12 C34 16, 20 30, 16 48 Z" fill="#ffffff" opacity="0.15"/>
</svg>
