<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <filter id="mail-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#8b5cf6" flood-opacity="0.35"/>
    </filter>
    <filter id="letter-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Main Mail Squircle Gradient -->
    <linearGradient id="mail-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Envelope Body Gradient -->
    <linearGradient id="env-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Envelope Flap Gradient -->
    <linearGradient id="env-flap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Notification / Send Badge Gradient -->
    <linearGradient id="send-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle Glass Card -->
  <rect x="8" y="8" width="80" height="80" rx="22" fill="url(#mail-bg)" filter="url(#mail-glow)"/>
  <rect x="8.5" y="8.5" width="79" height="79" rx="21.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Envelope Body Base -->
  <rect x="18" y="32" width="60" height="42" rx="7" fill="url(#env-body)" filter="url(#letter-shadow)"/>

  <!-- Envelope Fold Flaps (Bottom/Side creases) -->
  <path d="M18 70 L48 48 L78 70" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M18 36 L48 56 L78 36" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- Envelope Top V-Flap (Dimensional folded shape) -->
  <path d="M18 35 C18 33, 20 32, 23 32 L73 32 C76 32, 78 33, 78 35 L48 55 Z" fill="url(#env-flap)"/>

  <!-- Glowing Send Plane / Chat Badge at Top-Right -->
  <circle cx="70" cy="26" r="13" fill="url(#send-badge)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/>
  <!-- Paper airplane icon inside badge -->
  <path d="M63 26 L77 20 L73 31 L69 27 L67 30 L66 26 Z" fill="#ffffff"/>
  <path d="M69 27 L74 21" stroke="#0284c7" stroke-width="1" stroke-linecap="round"/>

  <!-- Glass Highlight Arc -->
  <path d="M12 18 C20 10, 40 8, 56 12 C34 16, 20 30, 16 48 Z" fill="#ffffff" opacity="0.15"/>
</svg>
